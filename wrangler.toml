# JINZA Beat Store — Cloudflare Pages config
name = "jinza-beats"
compatibility_date = "2026-10-01"

[vars]
APP_ENV = "development"
SITE_URL = "http://localhost:8788"
DOWNLOAD_TOKEN_TTL_MINUTES = "30"
DOWNLOAD_MAX_USES = "5"

